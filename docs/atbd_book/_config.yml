
title: Algorithm Theoretical Baseline Document (ATBD) V1

author: ROSE-L-ARD Team

version: "1.1"

date: "31/08/2025"

# project: PROTOTYPE PROCESSOR FOR ANALYSIS READY DATA OF COPERNICUS SAR MISSIONS

# - Federico Minati (B-Open Solutions)
# - Francesco De Zan (Delta-Phi Gmbh)
# - Juan M Lopez-Sanchez (Universidad de Alicante)
# - P. Lopez Dekker (TU-Delft)

# logo: logo.png
execute:
  execute_notebooks: off

# Citations and bibliography
bibtex_bibfiles:
  - references.bib  # Path to your .bib file

sphinx:
  extra_extensions:
    - sphinx.ext.mathjax      # Render LaTeX with MathJax
    - sphinx.ext.todo         # Enable TODO directives
    - sphinx.ext.autosectionlabel  # Automatically label sections for easy cross-referencing
    - sphinxcontrib.bibtex
  bibtex_bibfiles:
    - references.bib  # Path to your .bib file
  bibtex_reference_style: numeric
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js  # Enable MathJax for LaTeX rendering
    autosectionlabel_prefix_document: true # Optional: Add document name to section labels
  latex_elements:
    papersize: a4paper # or 'letterpaper'
    pointsize: 11pt    # or '10pt', '12pt'
    preamble: |
      \usepackage{pdfpages}
      \usepackage[pdftex,
        bookmarks=true,
        bookmarksopen=true,
        colorlinks=true,
        linkcolor=blue,
        urlcolor=blue,
        citecolor=blue]{hyperref}
      \pgfplotsset{compat=1.18}
    maketitle: |
      \includepdf[pages={1,2}]{esa-rose-l-004-D4_cover_page.pdf}
      \newpage
      \tableofcontents
      \newpage

# LaTeX settings for PDF export (optional)
latex:
  latex_documents:
    targetname: esa-rose-l-004-D4_Algorithm_Theoretical_Baseline_Document_ATBD.tex
  latex_engine: pdflatex
  template_path: _latex
  # use_jupyterbook_latex: true

repository:
  url: https://github.com/bopen/rose-l-ard 
  branch: main # Or your default branch name
  path_to_book: docs/atbd_book # Optional path to your book's folder, if it's not in the root
  edit_content: true # Optional, allows users to edit content

html:
  use_numbered_headers: true  # Enable numbered headers for sections
  use_issues_button: true
  use_repository_button: true
  use_edit_button: true
  home_page_in_navbar: false

